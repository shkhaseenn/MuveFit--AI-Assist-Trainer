[pytest]
# Only collect tests from backend/tests/
testpaths = backend/tests

# Exclude legacy exercise prototypes and frontend scripts
# from test collection (they're not test files)
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Don't try to collect from exercises/ or frontend/
norecursedirs = exercises frontend models docs

# Set working directory to project root so relative paths work
# when tests are run
addopts = --tb=short
